<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Voxel Diorama — Lil Worlds</title>
  <style>
    :root {
      --bg: #070a12;
      --ink: #f5efe0;
      --muted: #8a94a8;
      --accent: #2de8ff;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; background: var(--bg); color: var(--ink); font-family: 'Segoe UI', system-ui, sans-serif; overflow: hidden; }
    #app { position: fixed; inset: 0; }
    #hud {
      position: fixed; top: 16px; left: 16px; z-index: 10;
      background: rgba(10,14,20,.85); border: 1px solid rgba(255,255,255,.08);
      border-radius: 12px; padding: 14px 18px; backdrop-filter: blur(8px);
      max-width: 320px;
    }
    #hud h1 { font-size: 15px; letter-spacing: .04em; margin-bottom: 4px; }
    #hud p { font-size: 11px; color: var(--muted); line-height: 1.5; margin-bottom: 12px; }
    .themes { display: flex; flex-direction: column; gap: 8px; }
    .modes { display: flex; gap: 6px; margin-bottom: 12px; }
    .mode-btn {
      flex: 1; cursor: pointer; border-radius: 6px; text-align: center;
      border: 1px solid rgba(255,255,255,.1); background: rgba(255,255,255,.04);
      color: var(--muted); font-size: 10px; padding: 6px 4px; transition: all .15s;
    }
    .mode-btn:hover { color: var(--ink); border-color: var(--accent); }
    .mode-btn.active { color: var(--ink); border-color: var(--accent); background: rgba(45,232,255,.14); }
    .theme-btn {
      width: 100%; text-align: left; cursor: pointer; border-radius: 8px;
      border: 1px solid rgba(255,255,255,.1); background: rgba(255,255,255,.04);
      color: var(--ink); font-size: 12px; padding: 10px 12px; transition: all .15s;
    }
    .theme-btn:hover { border-color: var(--accent); background: rgba(45,232,255,.08); transform: translateX(2px); }
    .theme-btn.active { border-color: var(--accent); background: rgba(45,232,255,.12); }
    #stats {
      position: fixed; bottom: 16px; left: 16px; z-index: 10;
      font: 11px monospace; color: var(--muted); background: rgba(10,14,20,.7);
      padding: 8px 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,.06);
    }
    #hint {
      position: fixed; bottom: 16px; right: 16px; z-index: 10;
      font-size: 11px; color: var(--muted); text-align: right; line-height: 1.6;
    }
    #back {
      position: fixed; top: 16px; right: 16px; z-index: 11; display: none;
      cursor: pointer; text-decoration: none;
      font-size: 12px; letter-spacing: .03em; color: var(--ink);
      background: rgba(10,14,20,.85); border: 1px solid rgba(255,255,255,.12);
      border-radius: 10px; padding: 9px 14px; backdrop-filter: blur(8px);
      transition: all .15s;
    }
    #back:hover { border-color: var(--accent); background: rgba(45,232,255,.14); color: var(--accent); }
  </style>
  <script type="module" crossorigin src="./assets/index-CGcEfhrU.js"></script>
</head>
<body>
  <div id="app"></div>
  <div id="hud">
    <h1>LIL WORLDS</h1>
    <p>Restore light to dormant voxel dioramas. Click blocks to inspect and trigger micro-details. Keys: 1–4 modes, Z undo, Ctrl+Z / Ctrl+Shift+Z, P photo, M mute.</p>
    <div class="modes" id="modes"></div>
    <div class="themes" id="themes"></div>
  </div>
  <div id="stats"></div>
  <a id="back" href="../index.html" title="Вернуться в LilCraft">← LILCRAFT</a>
  <script>
    // Кнопка возврата имеет смысл только когда приложение открыто как
    // подпапка lil-worlds/ внутри LilCraft (v_4) — там ../index.html живёт.
    if (/\/lil-worlds\/(index\.html)?$/i.test(location.pathname)) {
      var b = document.getElementById('back');
      b.style.display = 'block';
      b.addEventListener('click', function () { try { window.close(); } catch (e) {} });
    }
  </script>
  <div id="hint">
    <b>Orbit</b> left-drag · <b>Pan</b> right-drag · <b>Zoom</b> scroll<br/>
    <b>Inspect</b> click block · <b>Mode</b> <span id="mode">inspect</span><br/>
    <b>Quality</b> auto-adaptive
  </div>
</body>
</html>
