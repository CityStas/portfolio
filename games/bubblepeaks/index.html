<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>Bubble Peaks</title>
		<style>
/*
 * Custom web shell. Godot regenerates `index.html` from this file on every
 * export, so this is the only copy that matters - never edit `web_ver/index.html`.
 *
 * The stock shell paints the loading screen flat `#242424` with a bare
 * `<progress>` bar and drops it the moment `startGame()` resolves. That leaves a
 * black gap while `main.tscn` builds the level, and the loader looks nothing like
 * the game. Here the loader wears the title card's own wash and logo, and it is
 * the *game* that dismisses it (see `window.bubblePeaksLoaderDone`), so the first
 * frame the player sees is already the finished title screen with PRESS ANY KEY.
 */
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

/*
 * Godot draws the HUD in a 1600x900 design space and scales the whole canvas by
 * `min(vw / 1600, vh / 900)` (`window/stretch/mode="canvas_items"`,
 * `aspect="expand"` in `project.godot`). The loader has to reproduce that scale,
 * because the title card's wordmark is a fixed 880x352 *design* rect: sized in
 * plain vw/vh the loader's copy of the same logo comes out ~17 % too big and the
 * 0.55 s crossfade reads as a double exposure instead of a dissolve.
 */
:root {
	--godot-scale: min(100vw / 1600, 100vh / 900);
}

body {
	color: #3a2b3f;
	/* Matches the intro card's wash in `hud.gd`: SKY_BLUE -> pink, so the handoff
	   from loader to title card has no colour jump. */
	background: linear-gradient(180deg, #b8e0fa 0%, #ffdceb 100%);
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status {
	position: absolute;
	left: 0;
	right: 0;
	top: 0;
	bottom: 0;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	background: linear-gradient(180deg, #b8e0fa 0%, #ffdceb 100%);
	visibility: hidden;
	opacity: 1;
	transition: opacity 0.55s ease;
	z-index: 10;
}

#status-splash {
	/* The title card draws `main_logo.png` into an 880 px wide design rect, and
	   the wordmark occupies 1881 of that file's 1983 px - so the mark itself is
	   834.7 design px across. `index.png` is the trimmed copy, whose mark fills
	   the whole frame, so matching widths is enough to match both axes. */
	position: absolute;
	left: 50%;
	top: 50%;
	width: calc(var(--godot-scale) * 834.7);
	height: auto;
	/* The title card breathes; the loader breathes with it. Same +/-3.5 % and the
	   same 2.86 s period as the pulse in `hud.gd`, so the two marks stay the same
	   size as they cross over. */
	animation: breathe 2.86s ease-in-out infinite;
}

@keyframes breathe {
	0%, 100% { transform: translate(-50%, -50%) scale(0.965); }
	50%      { transform: translate(-50%, -50%) scale(1.035); }
}

/* `show-image--false` is emitted by the export when the project has no boot
   splash; without this the wordmark would leave a hole. */
#status-splash.show-image--false {
	display: none;
}

/* The bar hangs off the centre rather than stacking under the wordmark: the logo
   is pinned dead centre to match the title card, and a flex column would push it
   off centre by half the bar's height. 224 design px = half the mark (176) plus
   the 48 px gap the bar used to get from `margin-top`. */
#status-below {
	position: absolute;
	left: 50%;
	top: calc(50% + var(--godot-scale) * 224);
	transform: translateX(-50%);
	display: flex;
	flex-direction: column;
	align-items: center;
}

#status-bar {
	display: none;
	width: calc(var(--godot-scale) * 520);
	height: calc(var(--godot-scale) * 20);
	background: rgba(255, 255, 255, 0.72);
	border-radius: 999px;
	box-shadow: inset 0 2px 5px rgba(58, 43, 63, 0.14);
	overflow: hidden;
}

#status-fill {
	width: 0%;
	height: 100%;
	background: linear-gradient(90deg, #f077a8 0%, #d3bdf0 100%);
	border-radius: 999px;
	/* No CSS transition: the fill is eased in `tick()`, which writes the width
	   and the percentage from one value. A transition here would animate the bar
	   behind the already-updated text and they would visibly disagree. */
}

#status-pct {
	display: none;
	margin-top: 0.85rem;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	font-size: 0.95rem;
	font-weight: 700;
	letter-spacing: 0.06em;
	color: #3a2b3f;
	opacity: 0.75;
}

/* Pinned to the floor: the wordmark owns the centre, so an error notice under it
   would otherwise sit on top of the logo. */
#status-notice {
	display: none;
	position: absolute;
	left: 50%;
	bottom: 7vh;
	transform: translateX(-50%);
	background-color: #fff7e8;
	border-radius: 0.6rem;
	border: 1px solid #f077a8;
	color: #3a2b3f;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.35;
	max-width: min(78vw, 880px);
	overflow: hidden;
	padding: 1rem 1.2rem;
	text-align: center;
	z-index: 1;
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>
<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>


	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--false use-filter--true" src="index.png" alt="Bubble Peaks">
			<div id="status-below">
				<div id="status-bar"><div id="status-fill"></div></div>
				<div id="status-pct">0%</div>
			</div>
			<div id="status-notice"></div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":47146540,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusBar = document.getElementById('status-bar');
	const statusFill = document.getElementById('status-fill');
	const statusPct = document.getElementById('status-pct');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';
	let loaderGone = false;

	/*
	 * Progress model.
	 *
	 * `onProgress` describes the two downloads and nothing else, and those finish
	 * long before the first frame does: the wasm still has to be instantiated, the
	 * 46 MB pck has to be copied into the engine's in-memory FS, and then
	 * `main.gd::_ready()` builds the entire level. Counting bytes alone therefore
	 * pinned the bar at 100 % for the last several seconds of the wait, which
	 * reads as a hang rather than as work.
	 *
	 * So the bar is split. Bytes own 0..88 %, the remaining 12 % is a slow creep
	 * that starts the moment the last byte lands and only finishes when the game
	 * itself reports its first frame (`bubblePeaksLoaderDone`). The visible value
	 * is eased toward the target once per frame, so the percentage and the fill
	 * can never disagree - the old code wrote both from one raw event but let CSS
	 * animate the fill behind the text.
	 */
	const DOWNLOAD_SHARE = 88;   // percent of the bar owned by the two downloads
	const BOOT_CEIL = 99;        // the creep stops one short until the game is up
	const CREEP_TAU = 4.0;       // seconds; the time constant of the boot creep

	let target = 0;
	let shown = 0;
	let bootStart = 0;
	let rafId = 0;
	let lastFrame = 0;
	let failed = false;

	function draw() {
		statusFill.style.width = shown + '%';
		// Floor, not round: rounding prints "100%" while the creep is still
		// running at 99.6.
		statusPct.textContent = Math.floor(shown) + '%';
	}

	function tick(now) {
		if (loaderGone || failed) {
			rafId = 0;
			return;
		}
		const dt = lastFrame === 0 ? 0.016 : Math.min(0.25, (now - lastFrame) / 1000);
		lastFrame = now;
		if (bootStart > 0) {
			const t = (now - bootStart) / 1000;
			const creep = DOWNLOAD_SHARE + (BOOT_CEIL - DOWNLOAD_SHARE) * (1 - Math.exp(-t / CREEP_TAU));
			if (creep > target) {
				target = creep;
			}
		}
		shown += (target - shown) * (1 - Math.exp(-dt / 0.22));
		if (target - shown < 0.01) {
			shown = target;
		}
		draw();
		rafId = window.requestAnimationFrame(tick);
	}

	function startTicker() {
		if (rafId === 0) {
			lastFrame = 0;
			rafId = window.requestAnimationFrame(tick);
		}
	}

	// The game calls this once its first frames are on screen. Until then the
	// loader stays up, which covers the level build in `main.gd::_ready()` - that
	// runs before the engine ever draws, and used to show as a black gap.
	window.bubblePeaksLoaderDone = function () {
		if (loaderGone) {
			return;
		}
		loaderGone = true;
		initializing = false;
		// Only now is 100 % true. Snap it so the bar is visibly full during the
		// 0.55 s fade instead of dissolving at 99.
		target = 100;
		shown = 100;
		draw();
		statusOverlay.style.opacity = '0';
		window.setTimeout(function () {
			if (statusOverlay.parentNode) {
				statusOverlay.parentNode.removeChild(statusOverlay);
			}
		}, 600);
	};

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			// Not an error path: wait for the game instead of yanking the screen.
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusBar.style.display = mode === 'progress' ? 'block' : 'none';
		statusPct.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
		if (mode === 'progress') {
			startTicker();
		}
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		// Stop the ticker before flipping to the notice, or it keeps re-drawing a
		// bar that is no longer on screen.
		failed = true;
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current <= 0 || total <= 0) {
					return;
				}
				// `total` is the sum of the wasm and the pck, so this ratio already
				// covers both. Clamped and monotonic: a clamped ratio can sit at 1
				// for a while, and the creep must not be undone by a late event.
				const bytes = Math.min(1, current / total) * DOWNLOAD_SHARE;
				if (bytes > target) {
					target = bytes;
				}
				// Last byte in. Start the creep now rather than when `startGame`
				// resolves - wasm instantiation and the FS copy happen in between,
				// and that gap is exactly what used to read as a hang at 100 %.
				if (bootStart === 0 && current >= total) {
					bootStart = performance.now();
				}
			},
		}).then(() => {
			// Deliberately NOT hiding here. `bubblePeaksLoaderDone` does that.
			if (bootStart === 0) {
				bootStart = performance.now();
			}
			startTicker();
			// Safety net only: if the game never signals (a script error before
			// the first frame, say), do not trap the player behind the loader.
			window.setTimeout(window.bubblePeaksLoaderDone, 60000);
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
