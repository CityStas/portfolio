<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<style>
  :root {
    --bg: #1e1e1e;
    --panel: #262626;
    --line: #383838;
    --text: #e6e6e6;
    --muted: #9a9a9a;
    --accent: #8b78e8;
    --accent-2: #6d59c9;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    display: flex; flex-direction: column;
    background: var(--bg); color: var(--text);
    font: 11px/1.45 Inter, "Segoe UI", system-ui, sans-serif;
  }
  header {
    padding: 10px 12px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 8px; background: var(--panel);
  }
  header .logo {
    width: 18px; height: 18px; border-radius: 6px;
    background: conic-gradient(from 210deg, #d7cdf5, #aa9bf0, #7864d7, #f9a3aa, #f9ecb0, #d7cdf5);
  }
  header b { font-size: 12px; font-weight: 600; }
  header small { display: block; color: var(--muted); font-size: 10px; }
  main { flex: 1; overflow-y: auto; padding: 10px 12px; display: flex; flex-direction: column; gap: 12px; }
  section { display: flex; flex-direction: column; gap: 6px; }
  h3 { margin: 0; font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: #a9a9a9; font-weight: 600; }
  .row { display: flex; gap: 6px; }
  input[type="text"], select {
    width: 100%; background: #141414; color: var(--text);
    border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; outline: none;
  }
  input[type="text"]:focus, select:focus { border-color: var(--accent); }
  button {
    border: 1px solid var(--line); background: #2f2f2f; color: var(--text);
    border-radius: 6px; padding: 6px 9px; cursor: pointer; white-space: nowrap;
  }
  button:hover { background: #3a3a3a; }
  button.primary { background: var(--accent-2); border-color: var(--accent); color: #fff; }
  button.primary:hover { background: #7a66d6; }
  button:disabled { opacity: .45; cursor: default; }
  .chips { display: flex; gap: 4px; flex-wrap: wrap; }
  .chip {
    border: 1px solid var(--line); border-radius: 999px; padding: 4px 9px;
    font-size: 10px; cursor: pointer; color: var(--muted); background: #232323;
  }
  .chip.active { border-color: var(--accent); color: #ded6ff; background: #2b2545; }
  .schemes { display: flex; flex-direction: column; gap: 4px; }
  .scheme {
    display: flex; align-items: center; gap: 6px; padding: 5px 7px;
    border: 1px solid var(--line); border-radius: 6px; cursor: pointer; background: #232323;
  }
  .scheme.active { border-color: var(--accent); background: #2b2545; }
  .scheme .nm { flex: 1; font-size: 10.5px; }
  .sw { display: flex; gap: 2px; }
  .sw i { width: 10px; height: 10px; border-radius: 2px; display: block; }
  .comps { display: flex; flex-direction: column; gap: 3px; max-height: 168px; overflow-y: auto; }
  .objs { display: flex; flex-wrap: wrap; gap: 4px; max-height: 126px; overflow-y: auto; }
  .obj {
    border: 1px solid var(--line); background: #232323; border-radius: 999px;
    padding: 4px 9px; font-size: 10px; cursor: pointer; color: var(--text);
  }
  .obj:hover { border-color: var(--accent); background: #2b2545; }  .comp {
    display: flex; gap: 6px; align-items: center; padding: 5px 6px;
    border: 1px solid var(--line); border-radius: 6px; cursor: pointer; background: #232323;
  }
  .comp:hover { border-color: var(--accent); }
  .comp .id { color: var(--muted); font-size: 9.5px; width: 46px; flex: none; }
  .comp .ob { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 10px; }
  .comp .fm { color: var(--muted); font-size: 9px; }
  .note { color: var(--muted); font-size: 10px; margin: 0; }
  .warn { color: #f0b86e; }
  .log {
    border-top: 1px solid var(--line); background: var(--panel);
    padding: 7px 12px; font-size: 10px; color: var(--muted);
    max-height: 96px; overflow-y: auto; white-space: pre-wrap;
  }
  .log b { color: var(--text); font-weight: 500; }
  .toggle { display: flex; align-items: center; gap: 6px; cursor: pointer; color: var(--text); font-size: 11px; }
  .toggle input { accent-color: var(--accent-2); }
  ::-webkit-scrollbar { width: 7px; }
  ::-webkit-scrollbar-thumb { background: #3d3d3d; border-radius: 6px; }
</style>
</head>
<body>
<header>
  <span class="logo"></span>
  <div>
    <b>Illustration Composer</b>
    <small id="file">сканирую библиотеку…</small>
  </div>
</header>

<main>
  <section>
    <h3>Цветовая схема</h3>
    <div class="schemes" id="schemes"></div>
    <div class="row" style="margin-top:4px">
      <button id="uploadBtn">Загрузить палитру…</button>
      <input type="file" id="fileInput" accept="application/json,.json" hidden />
    </div>
  </section>

  <section>
    <h3>Размер</h3>
    <div class="chips" id="sizes">
      <button class="chip active" data-size="L">L · крупный</button>
      <button class="chip" data-size="S">S · компактный</button>
    </div>
    <label class="toggle"><input type="checkbox" id="bgObjects" /> фоновые объекты</label>
  </section>

  <section>
    <h3>Объекты библиотеки <span id="objCount" class="note"></span></h3>
    <input type="text" id="objSearch" placeholder="поиск: ручка, книга, лампа…" />
    <div class="objs" id="objs"></div>
    <p class="note">Клик вставляет объект в центр вьюпорта в выбранном размере и состоянии.</p>
  </section>

  <section>
    <h3>Сборка по метафоре</h3>
    <div class="row">
      <input type="text" id="metaphor" placeholder="«финансовый рост», «идея и знания»" />
    </div>
    <div class="row">
      <select id="format"></select>
      <button class="primary" id="composeBtn">Собрать</button>
    </div>
  </section>

  <section>
    <h3>Готовые образцы <span id="compsCount" class="note"></span></h3>
    <div class="comps" id="comps"></div>
  </section>

  <section>
    <h3>Выделение</h3>
    <div class="row">
      <button id="recolorBtn">Перекрасить</button>
      <button id="swapMonoBtn">В фоновые</button>
      <button id="swapMainBtn">В главные</button>
    </div>
  </section>
</main>

<div class="log" id="log"></div>

<script>
  const $ = (s) => document.querySelector(s);
  let palettes = [];
  let comps = [];
  let objects = [];
  let custom = null;
  let schemeId = 'lilac';
  let sizeKey = 'L';

  function log(html) {
    const el = $('#log');
    el.innerHTML = html + (el.innerHTML ? '\n' + el.innerHTML : '');
  }

  function activePalette() {
    if (custom) return custom;
    return palettes.find((p) => p.id === schemeId) || palettes[0];
  }

  function renderSchemes() {
    const list = palettes.concat(custom ? [custom] : []);
    $('#schemes').innerHTML = list
      .map((p, i) => {
        const sw = (a) => a.map((c) => `<i style="background:${c}"></i>`).join('');
        const active = (custom ? p.id === custom.id : p.id === schemeId);
        return `<div class="scheme ${active ? 'active' : ''}" data-idx="${i}">
          <span class="nm">${p.name}</span>
          <span class="sw">${sw(p.bg)}</span>
          <span class="sw">${sw(p.obj)}</span>
        </div>`;
      })
      .join('');
    $('#schemes').querySelectorAll('.scheme').forEach((el) => {
      el.addEventListener('click', () => {
        const p = list[Number(el.dataset.idx)];
        custom = p.id.startsWith('custom') ? p : null;
        schemeId = p.id;
        renderSchemes();
      });
    });
  }

  function renderComps() {
    const fmt = $('#format').value;
    const list = comps.filter((c) => !fmt || c.format === fmt);
    $('#compsCount').textContent = list.length + ' шт.';
    $('#comps').innerHTML = list
      .map(
        (c) => `<div class="comp" data-id="${c.id}">
          <span class="id">${c.id}</span>
          <span class="ob">${c.objects.join(', ') || 'декор'}</span>
          <span class="fm">${c.format}</span>
        </div>`
      )
      .join('');
    $('#comps').querySelectorAll('.comp').forEach((el) => {
      el.addEventListener('click', () => insert(el.dataset.id));
    });
  }

  function renderObjects() {
    const q = ($('#objSearch').value || '').toLowerCase().trim();
    const list = objects.filter((n) => !q || n.toLowerCase().includes(q));
    $('#objCount').textContent = list.length + ' шт.';
    $('#objs').innerHTML = list
      .map((n) => `<button class="obj" data-name="${n.replace(/"/g, '&quot;')}">${n}</button>`)
      .join('');
    $('#objs').querySelectorAll('.obj').forEach((el) => {
      el.addEventListener('click', () => {
        parent.postMessage(
          {
            pluginMessage: {
              type: 'insertObject',
              name: el.dataset.name,
              sizeKey,
              schemeId,
              customPalette: custom,
              state: $('#bgObjects').checked ? 'background' : 'main',
            },
          },
          '*'
        );
      });
    });
  }

  $('#objSearch').addEventListener('input', renderObjects);

  function insert(compId) {
    const comp = comps.find((c) => c.id === compId);
    parent.postMessage(
      {
        pluginMessage: {
          type: 'insert',
          compId,
          schemeId,
          customPalette: custom,
          sizeKey,
          bgObjects: $('#bgObjects').checked,
          label: comp ? comp.id : compId,
        },
      },
      '*'
    );
  }

  $('#composeBtn').addEventListener('click', () => {
    const text = $('#metaphor').value.trim();
    if (!text) {
      log('Введите метафору или заголовок');
      return;
    }
    parent.postMessage(
      {
        pluginMessage: {
          type: 'compose',
          text,
          format: $('#format').value,
          schemeId,
          customPalette: custom,
          sizeKey,
          bgObjects: $('#bgObjects').checked,
        },
      },
      '*'
    );
  });

  $('#recolorBtn').addEventListener('click', () => {
    parent.postMessage({ pluginMessage: { type: 'recolor', schemeId, customPalette: custom } }, '*');
  });
  $('#swapMonoBtn').addEventListener('click', () => {
    parent.postMessage({ pluginMessage: { type: 'swapState', mono: true } }, '*');
  });
  $('#swapMainBtn').addEventListener('click', () => {
    parent.postMessage({ pluginMessage: { type: 'swapState', mono: false } }, '*');
  });

  document.querySelectorAll('#sizes .chip').forEach((b) =>
    b.addEventListener('click', () => {
      sizeKey = b.dataset.size;
      document.querySelectorAll('#sizes .chip').forEach((x) => x.classList.toggle('active', x === b));
    })
  );

  $('#uploadBtn').addEventListener('click', () => $('#fileInput').click());
  $('#fileInput').addEventListener('change', async (e) => {
    const f = e.target.files[0];
    if (!f) return;
    try {
      const raw = JSON.parse(await f.text());
      const bg = raw.bg || (raw.palette && raw.palette[0]) || raw.backgrounds;
      const obj = raw.obj || (raw.palette && raw.palette[1]) || raw.objects;
      if (!bg || !obj) throw new Error('нужны массивы bg и obj');
      custom = {
        id: 'custom-' + Date.now(),
        name: raw.name || 'Загруженная схема',
        bg: bg.map((c) => String(c).toUpperCase()),
        obj: obj.map((c) => String(c).toUpperCase()),
      };
      renderSchemes();
      log(`Палитра «<b>${custom.name}</b>» загружена: ${custom.bg.length} фоновых + ${custom.obj.length} объектных`);
    } catch (err) {
      log('Ошибка палитры: ' + err.message);
    } finally {
      e.target.value = '';
    }
  });

  window.onmessage = (event) => {
    const msg = event.data.pluginMessage;
    if (!msg) return;
    if (msg.type === 'init') {
      palettes = msg.palettes;
      comps = msg.comps;
      objects = msg.objects || [];
      renderObjects();
      $('#file').textContent = `${msg.file} · ${comps.length} образцов · v${msg.version}`;
      const formats = [...new Set(comps.map((c) => c.format))];
      $('#format').innerHTML = formats.map((f) => `<option value="${f}">${f.replace('x', ' × ')}</option>`).join('');
      $('#format').addEventListener('change', renderComps);
      renderSchemes();
      renderComps();
      log(`Готово: <b>${comps.length}</b> образцов, объектов в индексе: ${msg.objects.length}`);
      if (msg.warnings && msg.warnings.length) {
        msg.warnings.forEach((w) => log('<span class="warn">' + w + '</span>'));
      }
      if (!msg.objects.length) {
        log(
          'Объекты не найдены. Проверьте: открыт файл с библиотекой, страницы называются «Библиотека компонентов» и «Примеры композиций», секции — «Размер L» / «Размер S».'
        );
      }
      return;
    }
    if (msg.type === 'done') {
      const r = msg.result;
      if (msg.action === 'insert' || msg.action === 'compose') {
        let line = `Вставлено <b>${r.name}</b> · ${r.width}×${r.height}`;
        if (r.recolored) line += ` · перекрашено заливок: ${r.recolored}`;
        if (r.sizeSwapped) line += ` · заменено на размер ${sizeKey}: ${r.sizeSwapped}`;
        if (r.stateSwapped) line += ` · переведено в фоновые: ${r.stateSwapped}`;
        if (msg.action === 'compose' && msg.matched) {
          line += `\nСовпало: ${msg.matched.join(', ') || '—'}`;
          if (msg.missing && msg.missing.length) line += ` · нет в образце: ${msg.missing.join(', ')}`;
        }
        if (r.missing && r.missing.length) line += `\nНет варианта в библиотеке: ${[...new Set(r.missing)].join(', ')}`;
        log(line);
      } else if (msg.action === 'recolor') {
        log(`Перекрашено заливок: <b>${r.recolored}</b> в ${r.nodes} узл.`);
      } else if (msg.action === 'swapState') {
        log(`Состояние изменено у <b>${r.swapped}</b> объектов${r.missing.length ? ', нет варианта: ' + r.missing.join(', ') : ''}`);
      }
      return;
    }
    if (msg.type === 'error') log('Ошибка: ' + msg.message);
  };

  parent.postMessage({ pluginMessage: { type: 'ready' } }, '*');
</script>
</body>
</html>
